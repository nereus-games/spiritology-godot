name: CI

on:
  push:
  pull_request:

env:
  # Must stay in step with `config/features` in project.godot. The archive name follows
  # the Godot release convention: Godot_v<version>-stable_linux.x86_64.zip
  GODOT_VERSION: "4.6.3"

jobs:
  checks:
    name: Parsing and headless checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Cache the Godot binary
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Install Godot
        run: |
          set -euo pipefail
          if [[ ! -x "$HOME/godot/godot" ]]; then
            mkdir -p "$HOME/godot"
            url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            curl -fsSL "$url" -o /tmp/godot.zip
            unzip -q /tmp/godot.zip -d "$HOME/godot"
            mv "$HOME/godot"/Godot_v*_linux.x86_64 "$HOME/godot/godot"
            chmod +x "$HOME/godot/godot"
          fi
          echo "GODOT=$HOME/godot/godot" >> "$GITHUB_ENV"

      - name: Godot version
        run: "$GODOT --headless --version"

      # Both scripts rebuild the global class cache themselves; it is absent from a freshly
      # cloned repository (.godot/ is not versioned) — see tools/lib.sh.

      - name: Parse every script
        run: ./tools/parse_check.sh

      - name: Headless checks
        run: ./tools/run_checks.sh

  reuse:
    name: REUSE compliance (dual licence)
    runs-on: ubuntu-latest

    # Proves that NO file is left without a declared licence, including the ones added
    # later. It is the only way the code/content boundary is still true in six months.
    # A separate job: it needs no Godot and runs alongside the rest.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The charset-normalizer extra avoids depending on libmagic being present.
      - name: Install REUSE
        run: pip install --quiet "reuse[charset-normalizer]"

      - name: reuse lint
        run: reuse lint

  style:
    name: GDScript format and lint
    runs-on: ubuntu-latest

    # A separate job: gdtoolkit needs no Godot. `gdformat --check` fails when a file is
    # not in canonical form, `gdlint` applies gdlintrc (where every relaxation is justified
    # in the file itself).
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install --quiet "gdtoolkit==4.*"

      - name: gdformat --check
        run: gdformat --check $(git ls-files '*.gd')

      - name: gdlint
        run: gdlint $(git ls-files '*.gd')
