version = 1
SPDX-PackageName = "Spiritology"
SPDX-PackageSupplier = "Nereus Games LLC"
SPDX-PackageDownloadLocation = "https://github.com/nereus-games/spiritology-godot"

# This repository is DUALLY LICENSED, and the boundary follows the directory tree: a file
# is covered by the directory holding it, with no exception and no header to read. That is
# what lets this file be a dozen lines rather than two hundred SPDX headers, and lets
# `reuse lint` prove that no file is left without a licence.
#
#   CODE    -> GPL-3.0-or-later
#   CONTENT -> LAL-1.3 (assets, text, game-design and level-design data)
#
# Where to put a new file: if it is executed, it is code; if it is read, played, displayed
# or balanced, it is content. When in doubt, the directory decides.
#
# A document that IS game design (as opposed to technical documentation) goes in
# `docs/design/`; it then needs an LAL annotation here.

[[annotations]]
path = [
    "assets/**",       # sprites, icon
    "data/**",         # species, abilities, talents, objects — the game design itself
    "translations/**", # every displayed string
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Nereus Games LLC and the Spiritology authors (see AUTHORS)"
SPDX-License-Identifier = "LAL-1.3"

[[annotations]]
path = [
    "autoloads/**",
    "resources/**",
    "scripts/**",
    "scenes/**",
    "ui/**",
    "tools/**",
    "docs/**",         # technical documentation; the design lives in docs/design/
    ".github/**",
    "project.godot",
    ".gitignore",
    "REUSE.toml",
    "gdlintrc",
    "README.md",
    "CONTRIBUTING.md",
    "AUTHORS",
    "NOTICE",
    "CLAUDE.md",
    "AGENTS.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Nereus Games LLC and the Spiritology authors (see AUTHORS)"
SPDX-License-Identifier = "GPL-3.0-or-later"

# ORDER IS LOAD-BEARING: when several annotations name the same file, REUSE keeps the LAST
# one (verified with `reuse spdx`). This block must therefore stay after the code one, or
# `docs/**` takes the screenshots back and flips them to GPL.
[[annotations]]
path = ["docs/images/**", "docs/design/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Nereus Games LLC and the Spiritology authors (see AUTHORS)"
# A screenshot shows the game's art: it derives from it. docs/design/ IS game design, as
# opposed to the technical documentation in docs/ — the distinction announced in
# CONTRIBUTING.md.
SPDX-License-Identifier = "LAL-1.3"
