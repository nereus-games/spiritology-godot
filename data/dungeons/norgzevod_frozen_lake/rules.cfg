; Dungeon-wide rules of the Norgzévod frozen lake, from the designers' notes on the map.

; "SPAWN AT ENTRY": what is laid down when the dungeon is entered.
[spawn_at_entry]
rivals=10
examinable_decor=13
traps=4

; The asterisk under it: "DECOR: NOT 1st TIME; RIVAL SPAWN OFF WHILE ENCYCLOPAEDIA ISN'T OWNED".
; The encyclopaedia is an item received early in the game, and some dungeons can be entered
; before it is.
[conditions]
decor_on_first_visit=false
rivals_require_item="encyclopaedia"

; Falling into the water costs the usual fall damage, nothing more, and the player comes back up
; on this tile. Cell F25 of floor 0 (to be drawn on the map in its next version).
[water]
emerge="F25@0"

; Faults known and tolerated for now. Each is still printed, as a warning with its reason; remove
; the line once it is dealt with. The key is an issue code, or CODE:cell@floor for one place.
[waive]
BRIDGE_NO_WAY_BACK="the underground is work in progress: the way back up from floor -2 is not drawn yet"
