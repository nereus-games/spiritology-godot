name: CI

on:
  push:
  pull_request:

env:
  # Doit rester aligné sur `config/features` dans project.godot. Le nom de l'archive suit
  # la convention des releases Godot : Godot_v<version>-stable_linux.x86_64.zip
  GODOT_VERSION: "4.6.3"

jobs:
  checks:
    name: Parsing et vérifications headless
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Cache du binaire Godot
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Installer Godot
        run: |
          set -euo pipefail
          if [[ ! -x "$HOME/godot/godot" ]]; then
            mkdir -p "$HOME/godot"
            url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            curl -fsSL "$url" -o /tmp/godot.zip
            unzip -q /tmp/godot.zip -d "$HOME/godot"
            mv "$HOME/godot"/Godot_v*_linux.x86_64 "$HOME/godot/godot"
            chmod +x "$HOME/godot/godot"
          fi
          echo "GODOT=$HOME/godot/godot" >> "$GITHUB_ENV"

      - name: Version de Godot
        run: "$GODOT --headless --version"

      # Les deux scripts reconstruisent d'eux-mêmes le cache de classes globales, absent
      # d'un dépôt fraîchement cloné (.godot/ n'est pas versionné) — cf. tools/lib.sh.

      - name: Parser tous les scripts
        run: ./tools/parse_check.sh

      - name: Vérifications headless
        run: ./tools/run_checks.sh

  reuse:
    name: Conformité REUSE (double licence)
    runs-on: ubuntu-latest

    # Prouve qu'AUCUN fichier n'est sans licence déclarée, y compris ceux ajoutés plus
    # tard. C'est le seul moyen que la frontière code/contenu reste vraie dans six mois.
    # Job séparé : il n'a pas besoin de Godot et tourne en parallèle du reste.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # L'extra charset-normalizer évite de dépendre de la présence de libmagic.
      - name: Installer REUSE
        run: pip install --quiet "reuse[charset-normalizer]"

      - name: reuse lint
        run: reuse lint

  style:
    name: Format et lint GDScript
    runs-on: ubuntu-latest

    # Job séparé : gdtoolkit n'a pas besoin de Godot. `gdformat --check` échoue si un
    # fichier n'est pas au format canonique, `gdlint` applique gdlintrc (dont chaque
    # assouplissement est justifié dans le fichier lui-même).
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer gdtoolkit
        run: pip install --quiet "gdtoolkit==4.*"

      - name: gdformat --check
        run: gdformat --check $(git ls-files '*.gd')

      - name: gdlint
        run: gdlint $(git ls-files '*.gd')
